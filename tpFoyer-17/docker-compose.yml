version: '3.8'

services:
  app:
    image: mon_image:latest
    container_name: mon_container_v2
    ports:
      - "8082:8082"
    environment:
      - SOME_ENV_VAR=value
    restart: unless-stopped
  prometheus:
    image: prom/prometheus
    container_name: prometheus_v2
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9091:9090"
    restart: unless-stopped
  grafana:
    image: grafana/grafana
    container_name: grafana_v2
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ADMIN_USER=admin
    depends_on:
      - prometheus
    restart: unless-stopped