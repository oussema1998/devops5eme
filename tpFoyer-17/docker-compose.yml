version: '3.8'

services:
  mysqldb:
    image: mysql:5.7
    restart: unless-stopped
    ports:
      - 3307:3306
    environment:
      - MYSQL_ALLOW_EMPTY_PASSWORD=yes
    volumes:
      - db:/var/lib/mysql
  tpfoyer_app:
    build: ./
    restart: on-failure
    ports:
      - "8082:8082"
    depends_on:
      - mysqlbd
    environment:
      SPRING_APPLICATION_JSON: '{
        "server.servlet.context-path": "/tpFoyer17",
        "server.port": "8082",
        "spring.datasource.url": "jdbc:mysql://mysqlbd:3306/tpFoyer17?&createDatabaseIfNotExist=true&useUnicode=true&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=UTC",
        "spring.datasource.username": "root",
        "spring.datasource.password": "",
        "spring.jpa.show-sql": "true",
        "spring.jpa.properties.hibernate.dialect" : "org.hibernate.dialect.MySQL8Dialect",
        "spring.jpa.hibernate.ddl-auto": "update"
        
      }'

  angular_frontend:
    image: ibtihelle/angular-project:latest
    container_name: angular-frontend
    restart: on-failure
    ports:
      - "4200:80"  # Expose Angular app on port 4200
    depends_on:
      - tpfoyer_app  # Wait for backend to be ready

volumes:
  db:
